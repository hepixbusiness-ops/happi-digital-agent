  .doc { max-width: 760px; margin: 0 auto; padding: 6rem 1.5rem 5rem; color: var(--ink); }
  .doc h1 { font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.02em; line-height: 1.1; margin-bottom: 1rem; }
  .doc h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 2.5rem 0 .75rem; }

<body>
<main class="doc">
<h1>Connexion TikTok</h1>
<div id="resultat"><p>Lecture de la réponse TikTok…</p></div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var zone = document.getElementById('resultat');
    var erreur = p.get('error');
    var code = p.get('code');
    var compte = (p.get('state') || '').split('.')[0];
    if (erreur || !code) {
      zone.innerHTML = '<p>TikTok n\'a pas donné son accord.</p><p class="maj"></p>';
      zone.querySelector('.maj').textContent = (erreur || 'aucun code') + ' ' + (p.get('error_description') || '');
      return;
    }
    var commande = 'node auth.js code ' + compte + ' ' + encodeURIComponent(code);
    zone.innerHTML = '<p>Autorisation reçue pour le compte <strong></strong>. Lance cette commande dans le dossier tiktok-agent, dans les 5 minutes (le code expire vite) :</p>' +
      '<pre style="white-space:pre-wrap;word-break:break-all;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:1rem;font-size:.9rem"></pre>' +
      '<button class="btn-primary" type="button">Copier la commande</button>';
    zone.querySelector('strong').textContent = compte;
    zone.querySelector('pre').textContent = commande;
    var bouton = zone.querySelector('button');
    bouton.addEventListener('click', function () {
      navigator.clipboard.writeText(commande).then(function () { bouton.textContent = 'Copié'; });
    });
  })();
</script>
